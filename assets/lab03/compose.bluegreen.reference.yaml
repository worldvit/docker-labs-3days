# 참고용 정답 예시 — 블루/그린 배포용 (태스크 9)
#
#   app 만 별칭 appsvc 를 가지고, app_green 은 별칭이 없다.
#   따라서 green 을 3대 다 띄워도 트래픽은 한 건도 가지 않는다.
#   검증이 끝나면 nginx 의 목적지를 app_green 으로 바꿔 한 번에 전환한다.
name: shop

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  app:                      # blue — 구버전
    image: myflask:v1
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases: [appsvc]   # ← 별칭 공유
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  app_green:                # green — 신버전 (대기 · 트래픽 0)
    image: myflask:v2
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]     # ← 별칭 없음. 트래픽이 오지 않는다
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - shopdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  frontend:
  backend:

volumes:
  shopdata:
