# Docker 내장 DNS(127.0.0.11)를 리졸버로 지정한다.
# upstream 블록에 server app:5000; 을 쓰면 nginx가 기동 시점에 이름을 한 번만
# 해석하고 첫 번째 IP에 고정되어 버려, --scale 로 늘려도 분산되지 않는다.
# 변수와 resolver 를 쓰면 요청마다 다시 해석되어 replica 전체로 분산된다.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://app:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $hc http://app:5000/health;
        proxy_pass $hc;
        access_log off;
    }
}
