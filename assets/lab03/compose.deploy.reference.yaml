# 참고용 정답 예시 — 롤링 · 카나리 배포용 (태스크 8 · 10)
#
#   app 과 app_green 이 같은 별칭 appsvc 를 가진다.
#   내장 DNS 가 두 서비스의 컨테이너를 한 이름으로 돌려주므로
#   대수 비율이 곧 트래픽 비율이 된다.
name: shop

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  app:                      # blue — 구버전
    image: myflask:v1
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases: [appsvc]   # ← 별칭 공유
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  app_green:                # green — 신버전
    image: myflask:v2
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases: [appsvc]   # ← 같은 별칭. 여기가 핵심
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - shopdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  frontend:
  backend:

volumes:
  shopdata:
