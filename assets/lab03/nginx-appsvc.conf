# 배포 전략 실습용 — 서비스 이름이 아니라 "별칭(appsvc)" 으로 보낸다.
#
#   app 과 app_green 두 서비스가 같은 별칭 appsvc 를 가지면
#   내장 DNS 가 양쪽 컨테이너를 한 이름으로 돌려주므로
#   nginx 는 설정을 바꾸지 않고도 두 버전에 분산한다. (롤링 · 카나리)
#
#   적용 : cp nginx-appsvc.conf nginx.conf && docker compose exec web nginx -s reload
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://appsvc:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $hc http://appsvc:5000/health;
        proxy_pass $hc;
        access_log off;
    }
}
