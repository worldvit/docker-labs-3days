# 블루/그린 전환용 — 트래픽 목적지를 app_green 으로 한 번에 옮긴다.
#
#   전환 : cp nginx-green.conf  nginx.conf && docker compose exec web nginx -s reload
#   롤백 : cp nginx-appsvc.conf nginx.conf && docker compose exec web nginx -s reload
#
#   주의 : sed -i 로 고치면 안 된다. sed 는 새 파일을 만들어 바꿔치기하므로
#          단일 파일 바인드 마운트가 끊어지고 컨테이너는 옛 내용을 계속 본다.
#          반드시 cp 로 덮어써야 같은 파일(아이노드)이 유지된다.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://app_green:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $hc http://app_green:5000/health;
        proxy_pass $hc;
        access_log off;
    }
}
